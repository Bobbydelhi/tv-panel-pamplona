    80: 'Chubascos', 81: 'Chubascos', 82: 'Chubascos fuertes', 95: 'Tormenta', 96: 'Tormenta con granizo'
  };
  return map[code] || 'Pamplona';
}

async function loadWeather() {
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true`);
    const data = await res.json();
    const t = Math.round(data.current_weather.temperature);
    document.getElementById('temp').textContent = t + '°C';
    document.getElementById('weatherDesc').textContent = weatherCodeToDesc(data.current_weather.weathercode);
  } catch (e) {
    document.getElementById('weatherDesc').textContent = 'Sin conexión';
  }
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);

const PRAYER_NAMES = {
  Fajr: 'Fajr', Sunrise: 'Shuruq', Dhuhr: 'Dhuhr', Asr: 'Asr', Maghrib: 'Maghrib', Isha: 'Isha'
};

async function loadPrayerTimes() {
  try {
    const today = new Date();
    const dateStr = String(today.getDate()).padStart(2,'0') + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + today.getFullYear();
    const res = await fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${LAT}&longitude=${LON}&method=3`);
    const data = await res.json();
    const t = data.data.timings;
    const order = ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
    const nowMinutes = today.getHours() * 60 + today.getMinutes();

    let nextIdx = -1;
    const minutesArr = order.map(k => {
      const [h,m] = t[k].split(':').map(Number);
      return h * 60 + m;
    });
    for (let i = 0; i < minutesArr.length; i++) {
      if (minutesArr[i] > nowMinutes) { nextIdx = i; break; }
    }

    const list = document.getElementById('prayerList');
    list.innerHTML = '';
    order.forEach((k, idx) => {
      const row = document.createElement('div');
      row.className = 'prayer-row' + (idx === nextIdx ? ' next' : '');
      row.innerHTML = `<span class="name">${PRAYER_NAMES[k]}</span><span class="time">${t[k].split(' ')[0]}</span>`;
      list.appendChild(row);
    });
  } catch (e) {
    document.getElementById('prayerList').innerHTML = '<div class="prayer-row"><span class="name">Sin conexión</span></div>';
  }
}
loadPrayerTimes();
setInterval(loadPrayerTimes, 30 * 60 * 1000);
</script>
